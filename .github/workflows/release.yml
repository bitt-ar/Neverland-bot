name: Release & Build Automation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Release Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Verify Builds
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile main.py
          python -m py_compile cli/neverland.py
          cd dashboard
          pnpm install --frozen-lockfile=false
          pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          MONGODB_URI: "mongodb://localhost:27017/neverland"
          CONTROL_PLANE_SECRET: "release_verification_secret_012345"

      - name: Create Release Tarballs & Checksums
        run: |
          VERSION="${{ steps.vars.outputs.TAG_NAME }}"
          mkdir -p dist
          
          # Create clean archive without .git
          git archive --format=tar.gz --prefix="Neverland-${VERSION}/" HEAD -o "dist/Neverland-${VERSION}.tar.gz"
          git archive --format=zip --prefix="Neverland-${VERSION}/" HEAD -o "dist/Neverland-${VERSION}.zip"
          
          # Copy standalone installers into dist
          cp install.sh "dist/install.sh"
          cp install.ps1 "dist/install.ps1"
          
          # Generate SHA256 checksums
          cd dist
          sha256sum Neverland-${VERSION}.tar.gz Neverland-${VERSION}.zip install.sh install.ps1 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "Neverland ${{ steps.vars.outputs.TAG_NAME }} - All-in-One Automation Platform"
          body: |
            ## 🌟 Neverland ${{ steps.vars.outputs.TAG_NAME }}
            
            Enterprise-grade All-in-One Discord automation platform paired with a real-time Next.js 15 dashboard and unified cross-platform CLI.
            
            ### ⚡ Quick Install
            
            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/bitt-ar/Neverland-bot/main/install.ps1 | iex
            ```
            
            **Linux & macOS (Bash):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/bitt-ar/Neverland-bot/main/install.sh | bash
            ```
            
            ### 🛠️ What's New in this Release
            - Unified `neverland` CLI (`config`, `start`, `stop`, `status`, `logs`, `domain`, `uninstall`).
            - Strict environment isolation between Development and Production.
            - Automated server reverse proxy generator for custom domain binding.
            - Real-time Next.js 15 dashboard with dark Supabase styling and bidirectional IPC.
            
            ---
            
            ### ☕ Support the Creator
            Support continuous development on Ko-fi: **[https://ko-fi.com/E1E41CVWBU](https://ko-fi.com/E1E41CVWBU)**
          files: |
            dist/Neverland-${{ steps.vars.outputs.TAG_NAME }}.tar.gz
            dist/Neverland-${{ steps.vars.outputs.TAG_NAME }}.zip
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
