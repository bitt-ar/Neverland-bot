name: Release & Build Automation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Release Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Verify Builds
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile main.py
          python -m py_compile cli/neverland.py
          cd dashboard
          pnpm install --no-frozen-lockfile --config.strict-peer-dependencies=false
          pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          MONGODB_URI: "mongodb://localhost:27017/neverland"
          CONTROL_PLANE_SECRET: "release_verification_secret_012345"

      - name: Prepare Release Artifacts & Checksums
        run: |
          mkdir -p dist
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          cd dist
          sha256sum install.sh install.ps1 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "Neverland ${{ steps.vars.outputs.TAG_NAME }}"
          body: |
            ## Neverland ${{ steps.vars.outputs.TAG_NAME }}

            Neverland ${{ steps.vars.outputs.TAG_NAME }} establishes the initial production release of the All-in-One Discord automation platform, pairing an asynchronous Python bot core with a real-time Next.js 15 dashboard and an integrated cross-platform CLI.

            ### Features & Capabilities

            #### Universal CLI (`neverland`)
            - **Interactive Configuration (`neverland config`)**: Dedicated setup wizard for Development and Production environments with mode-specific field prompts and preserved previous values.
            - **Profile Isolation**: Strict isolation between `.neverland/profiles/dev.env` and `prod.env`. Modifying one profile never affects or overwrites the other.
            - **Process Management (`neverland start`, `stop`, `restart`)**: Dual-process lifecycle coordination for both the Discord bot daemon and Next.js 15 dashboard, supporting both interactive foreground and detached daemon modes.
            - **Telemetry & Monitoring (`neverland status`, `logs`)**: Real-time process inspection, port verification, and streaming log monitors.
            - **Server Deployment Tools (`neverland domain`)**: Reverse proxy configuration generators for Nginx and Caddy, alongside Linux systemd unit file generators.
            - **Uninstallation Wizard (`neverland uninstall`)**: Safe teardown workflow with explicit confirmation protection.

            #### Modular Discord Engine
            - **Support Tickets**: Race-safe ticket channel creation with atomic database counters, private channel isolation, and persistent components surviving restarts.
            - **Moderation Suite**: Infraction case tracking for warning, timeout, kick, and ban actions with direct message notices and audit logging.
            - **Giveaways**: Interactive giveaway creator with embed banners, duration countdowns, entry multipliers, role gates, and context menu reroll triggers.
            - **Temporary Voice**: Dynamic voice channel generation on demand with automated ownership delegation, permission locks, member limits, and channel cleanup upon exit.
            - **Leveling & Experience**: Message and voice XP calculation, per-user rate limiting, customizable announcements, rank cards rendered dynamically via Pillow, and tiered role rewards.
            - **Reaction Roles**: Multi-mode role distribution via classic reactions, persistent Discord component buttons, and interactive dropdown selection menus with live configuration sync.
            - **Control Plane IPC**: Real-time bidirectional control bridge between Next.js 15 route handlers and the Discord bot daemon (:8800) with cryptographic token validation.

            ### Installation

            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/bitt-ar/Neverland-bot/main/scripts/install.ps1 | iex
            ```

            **Linux & macOS (Bash):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/bitt-ar/Neverland-bot/main/scripts/install.sh | bash
            ```
          files: |
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
