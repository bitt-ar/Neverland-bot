name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-bot:
    name: Discord Bot & CLI Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python Core & CLI
        run: |
          python -m py_compile main.py
          python -m py_compile cli/neverland.py
          python -m py_compile core/config.py
          python -m py_compile core/database.py

  dashboard:
    name: Next.js 15 Dashboard Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          pnpm install --no-frozen-lockfile --config.strict-peer-dependencies=false

      - name: Run Dashboard Lint
        run: |
          cd dashboard
          pnpm lint

      - name: Build Dashboard
        run: |
          cd dashboard
          pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          MONGODB_URI: "mongodb://localhost:27017/neverland_test"
          CONTROL_PLANE_SECRET: "ci_test_secret_1234567890123456"
